<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mawww-AM — Alight Motion Premium Activator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: linear-gradient(135deg, #0a1628 0%, #1a2942 50%, #0a1628 100%); color: #e8f0ff; min-height: 100vh; padding: 20px; display: flex; align-items: center; justify-content: center; }
        .container { max-width: 520px; width: 100%; }
        .header { text-align: center; margin-bottom: 24px; }
        .logo { font-size: 48px; margin-bottom: 8px; filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.5)); }
        .header h1 { font-size: 32px; background: linear-gradient(90deg, #50aaff, #7dd3fc, #50aaff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; font-weight: 800; margin-bottom: 4px; }
        .header p { color: #7a9bc4; font-size: 13px; }
        .card { background: rgba(20, 32, 52, 0.85); backdrop-filter: blur(10px); border: 1.5px solid #3b82f6; border-radius: 16px; padding: 24px; box-shadow: 0 8px 32px rgba(59, 130, 246, 0.2); margin-bottom: 16px; }
        .card h2 { font-size: 16px; color: #60a5fa; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
        .steps { display: flex; gap: 8px; margin-bottom: 16px; }
        .step { flex: 1; padding: 8px; text-align: center; font-size: 11px; font-weight: 700; background: rgba(13, 27, 46, 0.6); border: 1px solid #2a4a6f; border-radius: 8px; color: #7a9bc4; }
        .step.active { background: rgba(59, 130, 246, 0.25); color: #7dd3fc; border-color: #3b82f6; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 12px; color: #7a9bc4; margin-bottom: 6px; font-weight: 600; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px 14px; background: #0d1b2e; border: 1px solid #2a4a6f; border-radius: 8px; color: #a5d8ff; font-size: 13px; outline: none; transition: all 0.2s; }
        .form-group input:focus, .form-group textarea:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }
        .form-group textarea { resize: vertical; min-height: 80px; font-family: monospace; }
        .btn { padding: 14px 20px; font-size: 14px; font-weight: 700; border: none; border-radius: 10px; cursor: pointer; transition: all 0.2s; width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; letter-spacing: 0.3px; }
        .btn:hover { transform: translateY(-2px); }
        .btn:active { transform: translateY(0); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-primary { background: linear-gradient(135deg, #2563eb, #3b82f6); color: white; box-shadow: 0 4px 16px rgba(59, 130, 246, 0.4); }
        .btn-primary:hover:not(:disabled) { box-shadow: 0 6px 24px rgba(59, 130, 246, 0.6); }
        .btn-success { background: linear-gradient(135deg, #059669, #10b981); color: white; box-shadow: 0 4px 16px rgba(16, 185, 129, 0.4); }
        .btn-secondary { background: rgba(59, 130, 246, 0.15); color: #7dd3fc; border: 1px solid #3b82f6; }
        .alert { padding: 12px 16px; border-radius: 10px; font-size: 13px; margin-top: 14px; display: none; line-height: 1.5; }
        .alert.show { display: block; }
        .alert.success { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.4); color: #80ffb0; }
        .alert.error { background: rgba(255, 100, 100, 0.15); border: 1px solid rgba(255, 100, 100, 0.4); color: #ff8080; }
        .alert.info { background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.4); color: #7dd3fc; }
        .panel { display: none; }
        .panel.active { display: block; }
        .footer { text-align: center; font-size: 11px; color: #556b8a; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">⚡</div>
            <h1>Mawww-AM</h1>
            <p>Alight Motion Premium Activator</p>
        </div>

        <div class="card">
            <h2>🚀 Aktivasi Premium</h2>

            <div class="steps">
                <div class="step active" id="step1">1. Email</div>
                <div class="step" id="step2">2. Verifikasi</div>
                <div class="step" id="step3">3. Selesai</div>
            </div>

            <!-- STEP 1 -->
            <div class="panel active" id="panel1">
                <div class="form-group">
                    <label>📧 Email Alight Motion kamu</label>
                    <input type="email" id="email" placeholder="contoh@gmail.com">
                </div>
                <button class="btn btn-primary" id="btnSend" onclick="sendLink()">
                    📩 Kirim Magic Link
                </button>
                <div class="alert" id="alert1"></div>
            </div>

            <!-- STEP 2 -->
            <div class="panel" id="panel2">
                <div class="form-group">
                    <label>🔗 Paste link dari email</label>
                    <textarea id="link" placeholder="https://alight-creative.firebaseapp.com/verify?oobCode=..."></textarea>
                </div>
                <button class="btn btn-success" id="btnActivate" onclick="activate()">
                    ✅ Aktifkan Premium
                </button>
                <button class="btn btn-secondary" onclick="backToStep1()" style="margin-top:8px;">
                    ← Kembali
                </button>
                <div class="alert" id="alert2"></div>
            </div>

            <!-- STEP 3 -->
            <div class="panel" id="panel3">
                <div class="alert success show" id="alert3"></div>
                <button class="btn btn-primary" onclick="location.reload()" style="margin-top:12px;">
                    🔄 Aktivasi Lagi
                </button>
            </div>
        </div>

        <div class="footer">
            © 2026 Mawww-AM — Unofficial tool, use at your own risk
        </div>
    </div>

    <script>
        function showPanel(n) {
            document.querySelectorAll('.panel').forEach((p, i) => p.classList.toggle('active', i === n - 1));
            document.querySelectorAll('.step').forEach((s, i) => s.classList.toggle('active', i < n));
        }

        function showAlert(id, msg, type) {
            const el = document.getElementById(id);
            el.textContent = msg;
            el.className = 'alert show ' + type;
        }

        function hideAlert(id) {
            document.getElementById(id).className = 'alert';
        }

        async function sendLink() {
            const email = document.getElementById('email').value.trim();
            if (!email) {
                showAlert('alert1', '❌ Masukkan email dulu!', 'error');
                return;
            }

            const btn = document.getElementById('btnSend');
            btn.disabled = true;
            btn.textContent = '⏳ Mengirim...';
            showAlert('alert1', '⏳ Mengirim magic link...', 'info');

            try {
                const res = await fetch('/api/send-link', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();

                if (data.ok) {
                    showAlert('alert1', '✅ ' + data.msg, 'success');
                    setTimeout(() => {
                        showPanel(2);
                        hideAlert('alert1');
                    }, 1500);
                } else {
                    showAlert('alert1', '❌ ' + data.msg, 'error');
                    btn.disabled = false;
                    btn.textContent = '📩 Kirim Magic Link';
                }
            } catch (e) {
                showAlert('alert1', '❌ Error: ' + e.message, 'error');
                btn.disabled = false;
                btn.textContent = '📩 Kirim Magic Link';
            }
        }

        async function activate() {
            const email = document.getElementById('email').value.trim();
            const link = document.getElementById('link').value.trim();
            if (!link) {
                showAlert('alert2', '❌ Paste link dari email dulu!', 'error');
                return;
            }

            const btn = document.getElementById('btnActivate');
            btn.disabled = true;
            btn.textContent = '⏳ Mengaktifkan...';
            showAlert('alert2', '⏳ Memverifikasi & mengaktifkan premium...', 'info');

            try {
                const res = await fetch('/api/activate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, link })
                });
                const data = await res.json();

                if (data.ok) {
                    showAlert('alert3', '🎉 ' + data.msg + '<br><br>📧 Email: ' + data.session.email + '<br>🆔 Order ID: ' + data.session.orderId, 'success');
                    showPanel(3);
                } else {
                    showAlert('alert2', '❌ ' + data.msg, 'error');
                    btn.disabled = false;
                    btn.textContent = '✅ Aktifkan Premium';
                }
            } catch (e) {
                showAlert('alert2', '❌ Error: ' + e.message, 'error');
                btn.disabled = false;
                btn.textContent = '✅ Aktifkan Premium';
            }
        }

        function backToStep1() {
            showPanel(1);
            hideAlert('alert2');
        }
    </script>
</body>
</html>
