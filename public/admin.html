<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mawww-AM — Owner Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        body {
            background: linear-gradient(135deg, #0a1628 0%, #1a2942 50%, #0a1628 100%);
            color: #e8f0ff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .login-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: rgba(20, 32, 52, 0.9);
            backdrop-filter: blur(10px);
            border: 1.5px solid #3b82f6;
            border-radius: 16px;
            padding: 32px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.2);
        }
        .login-card h1 {
            text-align: center;
            color: #60a5fa;
            margin-bottom: 6px;
            font-size: 28px;
        }
        .login-card p {
            text-align: center;
            color: #7a9bc4;
            font-size: 13px;
            margin-bottom: 24px;
        }
        
        input[type="password"], input[type="text"], input[type="email"] {
            width: 100%;
            padding: 12px 14px;
            background: #0d1b2e;
            border: 1px solid #2a4a6f;
            border-radius: 8px;
            color: #a5d8ff;
            font-size: 13px;
            outline: none;
            font-family: inherit;
            margin-bottom: 12px;
        }
        input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }
        
        .btn {
            padding: 12px 20px;
            font-size: 13px;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
            color: white;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn-primary { background: linear-gradient(135deg, #2563eb, #3b82f6); }
        .btn-success { background: linear-gradient(135deg, #059669, #10b981); }
        .btn-warning { background: linear-gradient(135deg, #d97706, #f59e0b); }
        .btn-danger  { background: linear-gradient(135deg, #dc2626, #ef4444); }
        .btn-secondary { background: rgba(59, 130, 246, 0.15); color: #7dd3fc; border: 1px solid #3b82f6; }
        .btn-full { width: 100%; }
        
        .dashboard { max-width: 1200px; margin: 0 auto; display: none; }
        .dashboard.show { display: block; }
        
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 16px 20px;
            background: rgba(20, 32, 52, 0.85);
            border: 1.5px solid #3b82f6;
            border-radius: 12px;
        }
        .topbar h1 {
            font-size: 20px;
            background: linear-gradient(90deg, #50aaff, #7dd3fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat {
            background: rgba(20, 32, 52, 0.85);
            border: 1.5px solid #2a4a6f;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }
        .stat-label { font-size: 11px; color: #7a9bc4; text-transform: uppercase; margin-bottom: 6px; }
        .stat-value { font-size: 24px; font-weight: 800; color: #7dd3fc; }
        .stat.pending .stat-value { color: #ffd066; }
        .stat.processing .stat-value { color: #7dd3fc; }
        .stat.approved .stat-value { color: #80ffb0; }
        .stat.rejected .stat-value { color: #ff8080; }
        
        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .filters input, .filters select {
            padding: 10px 14px;
            background: #0d1b2e;
            border: 1px solid #2a4a6f;
            border-radius: 8px;
            color: #a5d8ff;
            font-size: 12px;
            outline: none;
            font-family: inherit;
            margin: 0;
            width: auto;
        }
        .filters input { flex: 1; min-width: 200px; }
        .filters select { min-width: 140px; }
        
        .table-wrap {
            background: rgba(20, 32, 52, 0.85);
            border: 1.5px solid #3b82f6;
            border-radius: 12px;
            overflow: hidden;
        }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        thead { background: rgba(13, 27, 46, 0.9); }
        th {
            padding: 12px;
            text-align: left;
            color: #60a5fa;
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        td {
            padding: 12px;
            border-top: 1px solid #1e3a5f;
            color: #a5d8ff;
        }
        tr:hover { background: rgba(59, 130, 246, 0.05); }
        
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .b-pending { background: rgba(255, 200, 100, 0.2); color: #ffd066; border: 1px solid #ffd066; }
        .b-processing { background: rgba(100, 180, 255, 0.2); color: #7dd3fc; border: 1px solid #7dd3fc; }
        .b-approved { background: rgba(100, 255, 150, 0.2); color: #80ffb0; border: 1px solid #80ffb0; }
        .b-rejected { background: rgba(255, 100, 100, 0.2); color: #ff8080; border: 1px solid #ff8080; }
        
        .actions { display: flex; gap: 4px; flex-wrap: wrap; }
        .actions button {
            padding: 5px 8px;
            font-size: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.15s;
        }
        
        .empty {
            text-align: center;
            padding: 40px;
            color: #556b8a;
            font-size: 13px;
        }
        
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            color: white;
            z-index: 9999;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            transform: translateX(400px);
            transition: transform 0.3s;
        }
        .toast.show { transform: translateX(0); }
        .toast.success { background: linear-gradient(135deg, #059669, #10b981); }
        .toast.error { background: linear-gradient(135deg, #dc2626, #ef4444); }
        .toast.info { background: linear-gradient(135deg, #2563eb, #3b82f6); }
        
        @media (max-width: 768px) {
            table { font-size: 11px; }
            th, td { padding: 8px; }
            .stats { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="login-wrap" id="loginWrap">
        <div class="login-card">
            <h1>🛡️ Owner Panel</h1>
            <p>Mawww-AM Admin Dashboard</p>
            <input type="password" id="passwordInput" placeholder="Masukkan password admin" onkeypress="if(event.key==='Enter')doLogin()">
            <button class="btn btn-primary btn-full" onclick="doLogin()">
                🔓 Login
            </button>
            <div id="loginMsg" style="color:#ff8080;text-align:center;margin-top:10px;font-size:12px;"></div>
        </div>
    </div>

    <div class="dashboard" id="dashboard">
        <div class="topbar">
            <h1>🛡️ Mawww-AM Owner Panel</h1>
            <div style="display:flex;gap:8px;">
                <button class="btn btn-secondary" onclick="loadRequests()">🔄 Refresh</button>
                <button class="btn btn-danger" onclick="logout()">🚪 Logout</button>
            </div>
        </div>
        
        <div class="stats" id="stats"></div>
        
        <div class="filters">
            <input type="text" id="searchInput" placeholder="🔍 Cari email / WA / ID..." oninput="debounceLoad()">
            <select id="statusFilter" onchange="loadRequests()">
                <option value="all">Semua Status</option>
                <option value="pending">⏳ Pending</option>
                <option value="processing">⚙️ Processing</option>
                <option value="approved">✅ Approved</option>
                <option value="rejected">❌ Rejected</option>
            </select>
        </div>
        
        <div class="table-wrap">
            <div id="tableContainer">
                <div class="empty">Loading...</div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let adminPass = localStorage.getItem('mawww_am_admin') || '';
        let debounceTimer = null;

        async function doLogin() {
            const pass = document.getElementById('passwordInput').value;
            if (!pass) {
                document.getElementById('loginMsg').textContent = '❌ Masukkan password!';
                return;
            }
            
            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pass })
                });
                const data = await res.json();
                
                if (data.ok) {
                    adminPass = pass;
                    localStorage.setItem('mawww_am_admin', pass);
                    showDashboard();
                } else {
                    document.getElementById('loginMsg').textContent = '❌ ' + (data.msg || 'Login gagal');
                }
            } catch (e) {
                document.getElementById('loginMsg').textContent = '❌ Error: ' + e.message;
            }
        }

        function logout() {
            adminPass = '';
            localStorage.removeItem('mawww_am_admin');
            document.getElementById('loginWrap').style.display = 'flex';
            document.getElementById('dashboard').classList.remove('show');
            document.getElementById('passwordInput').value = '';
        }

        function showDashboard() {
            document.getElementById('loginWrap').style.display = 'none';
            document.getElementById('dashboard').classList.add('show');
            loadRequests();
        }

        function toast(msg, type = 'info') {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'toast show ' + type;
            setTimeout(() => el.classList.remove('show'), 2500);
        }

        function debounceLoad() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(loadRequests, 300);
        }

        async function loadRequests() {
            const search = document.getElementById('searchInput').value;
            const status = document.getElementById('statusFilter').value;
            
            const params = new URLSearchParams({
                admin_pass: adminPass,
                search: search,
                status: status
            });
            
            try {
                const res = await fetch('/api/admin/requests?' + params);
                if (!res.ok) { logout(); return; }
                const data = await res.json();
                
                document.getElementById('stats').innerHTML = `
                    <div class="stat">
                        <div class="stat-label">Total</div>
                        <div class="stat-value">${data.stats.total}</div>
                    </div>
                    <div class="stat pending">
                        <div class="stat-label">Pending</div>
                        <div class="stat-value">${data.stats.pending}</div>
                    </div>
                    <div class="stat processing">
                        <div class="stat-label">Processing</div>
                        <div class="stat-value">${data.stats.processing}</div>
                    </div>
                    <div class="stat approved">
                        <div class="stat-label">Approved</div>
                        <div class="stat-value">${data.stats.approved}</div>
                    </div>
                    <div class="stat rejected">
                        <div class="stat-label">Rejected</div>
                        <div class="stat-value">${data.stats.rejected}</div>
                    </div>
                `;
                
                if (!data.requests.length) {
                    document.getElementById('tableContainer').innerHTML = '<div class="empty">📭 Belum ada request</div>';
                    return;
                }
                
                let html = `<table><thead><tr>
                    <th>ID</th>
                    <th>Email</th>
                    <th>WhatsApp</th>
                    <th>Note</th>
                    <th>Status</th>
                    <th>Tanggal</th>
                    <th>Aksi</th>
                </tr></thead><tbody>`;
                
                data.requests.forEach(r => {
                    const date = new Date(r.createdAt).toLocaleString('id-ID', {
                        day: '2-digit', month: 'short', year: '2-digit',
                        hour: '2-digit', minute: '2-digit'
                    });
                    
                    const waLink = `https://wa.me/${r.whatsapp.replace(/[^0-9]/g, '')}`;
                    
                    html += `<tr>
                        <td><b>#${r.id}</b></td>
                        <td style="font-size:11px;">${r.email}</td>
                        <td>
                            <a href="${waLink}" target="_blank" style="color:#25D366;text-decoration:none;font-weight:700;">
                                📱 ${r.whatsapp}
                            </a>
                        </td>
                        <td style="font-size:11px;color:#7a9bc4;">${r.note || '—'}</td>
                        <td><span class="badge b-${r.status}">${r.status}</span></td>
                        <td style="font-size:10px;color:#7a9bc4;">${date}</td>
                        <td>
                            <div class="actions">
                                <button class="btn btn-warning" onclick="updateStatus(${r.id}, 'processing')" title="Proses">⚙️</button>
                                <button class="btn btn-success" onclick="updateStatus(${r.id}, 'approved')" title="Setujui">✅</button>
                                <button class="btn btn-danger" onclick="updateStatus(${r.id}, 'rejected')" title="Tolak">❌</button>
                                <button class="btn btn-secondary" onclick="deleteRequest(${r.id})" title="Hapus">🗑️</button>
                            </div>
                        </td>
                    </tr>`;
                });
                
                html += '</tbody></table>';
                document.getElementById('tableContainer').innerHTML = html;
                
            } catch (e) {
                toast('❌ Error: ' + e.message, 'error');
            }
        }

        async function updateStatus(id, status) {
            try {
                const res = await fetch(`/api/admin/update/${id}?admin_pass=${adminPass}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status })
                });
                const data = await res.json();
                
                if (data.ok) {
                    toast(`✅ Status #${id} → ${status}`, 'success');
                    loadRequests();
                } else {
                    toast('❌ ' + data.msg, 'error');
                }
            } catch (e) {
                toast('❌ Error: ' + e.message, 'error');
            }
        }

        async function deleteRequest(id) {
            if (!confirm(`Hapus request #${id}?`)) return;
            
            try {
                const res = await fetch(`/api/admin/delete/${id}?admin_pass=${adminPass}`, {
                    method: 'DELETE'
                });
                const data = await res.json();
                
                if (data.ok) {
                    toast(`🗑️ Request #${id} dihapus`, 'success');
                    loadRequests();
                }
            } catch (e) {
                toast('❌ Error: ' + e.message, 'error');
            }
        }

        if (adminPass) showDashboard();
    </script>
</body>
</html>
