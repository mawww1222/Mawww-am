<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mawww-AM — Admin Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: linear-gradient(135deg, #0a1628 0%, #1a2942 50%, #0a1628 100%); color: #e8f0ff; min-height: 100vh; padding: 20px; }
        .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: rgba(20, 32, 52, 0.9); backdrop-filter: blur(10px); border: 1.5px solid #3b82f6; border-radius: 16px; padding: 32px; max-width: 420px; width: 100%; box-shadow: 0 8px 32px rgba(59, 130, 246, 0.2); }
        .login-card h1 { text-align: center; color: #60a5fa; margin-bottom: 6px; font-size: 28px; }
        .login-card p { text-align: center; color: #7a9bc4; font-size: 13px; margin-bottom: 24px; }
        input[type="password"], input[type="text"] { width: 100%; padding: 12px 14px; background: #0d1b2e; border: 1px solid #2a4a6f; border-radius: 8px; color: #a5d8ff; font-size: 13px; outline: none; margin-bottom: 12px; }
        input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }
        .btn { padding: 12px 20px; font-size: 13px; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: white; }
        .btn:hover { transform: translateY(-1px); }
        .btn-primary { background: linear-gradient(135deg, #2563eb, #3b82f6); }
        .btn-success { background: linear-gradient(135deg, #059669, #10b981); }
        .btn-danger { background: linear-gradient(135deg, #dc2626, #ef4444); }
        .btn-secondary { background: rgba(59, 130, 246, 0.15); color: #7dd3fc; border: 1px solid #3b82f6; }
        .btn-full { width: 100%; }
        .dashboard { max-width: 1200px; margin: 0 auto; display: none; }
        .dashboard.show { display: block; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 16px 20px; background: rgba(20, 32, 52, 0.85); border: 1.5px solid #3b82f6; border-radius: 12px; }
        .topbar h1 { font-size: 20px; background: linear-gradient(90deg, #50aaff, #7dd3fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .stat { background: rgba(20, 32, 52, 0.85); border: 1.5px solid #2a4a6f; border-radius: 12px; padding: 16px; text-align: center; }
        .stat-label { font-size: 11px; color: #7a9bc4; text-transform: uppercase; margin-bottom: 6px; }
        .stat-value { font-size: 24px; font-weight: 800; color: #7dd3fc; }
        .tabs { display: flex; gap: 6px; margin-bottom: 16px; background: rgba(13, 27, 46, 0.6); padding: 4px; border-radius: 10px; border: 1px solid #2a4a6f; }
        .tab { flex: 1; padding: 10px; text-align: center; font-size: 12px; font-weight: 700; cursor: pointer; color: #7a9bc4; border-radius: 7px; transition: all 0.2s; text-transform: uppercase; }
        .tab.active { background: rgba(59, 130, 246, 0.25); color: #7dd3fc; }
        .panel { display: none; }
        .panel.active { display: block; }
        .filters { display: flex; gap: 8px; margin-bottom: 16px; }
        .filters input { flex: 1; padding: 10px 14px; background: #0d1b2e; border: 1px solid #2a4a6f; border-radius: 8px; color: #a5d8ff; font-size: 12px; outline: none; }
        .table-wrap { background: rgba(20, 32, 52, 0.85); border: 1.5px solid #3b82f6; border-radius: 12px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        thead { background: rgba(13, 27, 46, 0.9); }
        th { padding: 12px; text-align: left; color: #60a5fa; font-weight: 700; font-size: 11px; text-transform: uppercase; }
        td { padding: 12px; border-top: 1px solid #1e3a5f; color: #a5d8ff; }
        tr:hover { background: rgba(59, 130, 246, 0.05); }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
        .b-success { background: rgba(100, 255, 150, 0.2); color: #80ffb0; border: 1px solid #80ffb0; }
        .b-error { background: rgba(255, 100, 100, 0.2); color: #ff8080; border: 1px solid #ff8080; }
        .b-info { background: rgba(100, 180, 255, 0.2); color: #7dd3fc; border: 1px solid #7dd3fc; }
        .empty { text-align: center; padding: 40px; color: #556b8a; font-size: 13px; }
        .toast { position: fixed; top: 20px; right: 20px; padding: 14px 20px; border-radius: 10px; font-size: 13px; font-weight: 700; color: white; z-index: 9999; box-shadow: 0 8px 32px rgba(0,0,0,0.4); transform: translateX(400px); transition: transform 0.3s; }
        .toast.show { transform: translateX(0); }
        .toast.success { background: linear-gradient(135deg, #059669, #10b981); }
        .toast.error { background: linear-gradient(135deg, #dc2626, #ef4444); }
        .toast.info { background: linear-gradient(135deg, #2563eb, #3b82f6); }
        @media (max-width: 768px) { table { font-size: 11px; } th, td { padding: 8px; } }
    </style>
</head>
<body>
    <div class="login-wrap" id="loginWrap">
        <div class="login-card">
            <h1>🛡️ Admin Panel</h1>
            <p>Mawww-AM Dashboard</p>
            <input type="password" id="passwordInput" placeholder="Masukkan password admin" onkeypress="if(event.key==='Enter')doLogin()">
            <button class="btn btn-primary btn-full" onclick="doLogin()">🔓 Login</button>
            <div id="loginMsg" style="color:#ff8080;text-align:center;margin-top:10px;font-size:12px;"></div>
        </div>
    </div>

    <div class="dashboard" id="dashboard">
        <div class="topbar">
            <h1>🛡️ Mawww-AM Admin</h1>
            <div style="display:flex;gap:8px;">
                <button class="btn btn-secondary" onclick="loadAll()">🔄 Refresh</button>
                <button class="btn btn-danger" onclick="logout()">🚪 Logout</button>
            </div>
        </div>

        <div class="stats" id="stats"></div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab(this, 'sessions')">👥 Sesi User</div>
            <div class="tab" onclick="switchTab(this, 'logs')">📜 Log Aktivitas</div>
        </div>

        <!-- SESSIONS -->
        <div class="panel active" id="panel-sessions">
            <div class="filters">
                <input type="text" id="searchInput" placeholder="🔍 Cari email / order ID..." oninput="debounceLoad()">
            </div>
            <div class="table-wrap"><div id="sessionsContainer"><div class="empty">Loading...</div></div></div>
        </div>

        <!-- LOGS -->
        <div class="panel" id="panel-logs">
            <div class="table-wrap"><div id="logsContainer"><div class="empty">Loading...</div></div></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let adminPass = localStorage.getItem('mawww_am_admin') || '';
        let debounceTimer = null;

        async function doLogin() {
            const pass = document.getElementById('passwordInput').value;
            if (!pass) { document.getElementById('loginMsg').textContent = '❌ Masukkan password!'; return; }
            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pass })
                });
                const data = await res.json();
                if (data.ok) {
                    adminPass = pass;
                    localStorage.setItem('mawww_am_admin', pass);
                    showDashboard();
                } else {
                    document.getElementById('loginMsg').textContent = '❌ ' + (data.msg || 'Login gagal');
                }
            } catch (e) {
                document.getElementById('loginMsg').textContent = '❌ Error: ' + e.message;
            }
        }

        function logout() {
            adminPass = '';
            localStorage.removeItem('mawww_am_admin');
            document.getElementById('loginWrap').style.display = 'flex';
            document.getElementById('dashboard').classList.remove('show');
            document.getElementById('passwordInput').value = '';
        }

        function showDashboard() {
            document.getElementById('loginWrap').style.display = 'none';
            document.getElementById('dashboard').classList.add('show');
            loadAll();
        }

        function toast(msg, type = 'info') {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'toast show ' + type;
            setTimeout(() => el.classList.remove('show'), 2500);
        }

        function switchTab(el, type) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('panel-' + type).classList.add('active');
            if (type === 'logs') loadLogs();
        }

        function debounceLoad() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(loadSessions, 300);
        }

        async function loadAll() {
            await loadSessions();
            if (document.getElementById('panel-logs').classList.contains('active')) {
                loadLogs();
            }
        }

        async function loadSessions() {
            const search = document.getElementById('searchInput').value;
            const params = new URLSearchParams({ admin_pass: adminPass, search });
            try {
                const res = await fetch('/api/admin/sessions?' + params);
                if (!res.ok) { logout(); return; }
                const data = await res.json();

                document.getElementById('stats').innerHTML = `
                    <div class="stat"><div class="stat-label">Total Sesi</div><div class="stat-value">${data.stats.total}</div></div>
                    <div class="stat"><div class="stat-label">Hari Ini</div><div class="stat-value">${data.stats.today}</div></div>
                `;

                if (!data.sessions.length) {
                    document.getElementById('sessionsContainer').innerHTML = '<div class="empty">📭 Belum ada sesi</div>';
                    return;
                }

                let html = `<table><thead><tr><th>#</th><th>Email</th><th>Order ID</th><th>User ID</th><th>Waktu</th><th>Aksi</th></tr></thead><tbody>`;
                data.sessions.forEach(s => {
                    const date = new Date(s.activatedAt).toLocaleString('id-ID');
                    html += `<tr>
                        <td><b>#${s.id}</b></td>
                        <td style="font-size:11px;">${s.email}</td>
                        <td style="font-size:10px;font-family:monospace;color:#7dd3fc;">${s.orderId}</td>
                        <td style="font-size:10px;font-family:monospace;color:#7a9bc4;">${s.uid || '—'}</td>
                        <td style="font-size:11px;">${date}</td>
                        <td>
                            <button class="btn btn-danger" style="padding:5px 8px;font-size:10px;" onclick="deleteSession(${s.id})">🗑️</button>
                        </td>
                    </tr>`;
                });
                html += '</tbody></table>';
                document.getElementById('sessionsContainer').innerHTML = html;
            } catch (e) { toast('❌ Error: ' + e.message, 'error'); }
        }

        async function loadLogs() {
            try {
                const res = await fetch('/api/admin/logs?admin_pass=' + adminPass);
                if (!res.ok) return;
                const data = await res.json();

                if (!data.logs.length) {
                    document.getElementById('logsContainer').innerHTML = '<div class="empty">📭 Belum ada log</div>';
                    return;
                }

                let html = `<table><thead><tr><th>Tipe</th><th>Pesan</th><th>Waktu</th></tr></thead><tbody>`;
                data.logs.forEach(l => {
                    const cls = l.type.includes('error') ? 'b-error' : (l.type === 'activate' ? 'b-success' : 'b-info');
                    const date = new Date(l.time).toLocaleString('id-ID');
                    html += `<tr>
                        <td><span class="badge ${cls}">${l.type}</span></td>
                        <td style="font-size:11px;">${l.message}</td>
                        <td style="font-size:10px;color:#7a9bc4;">${date}</td>
                    </tr>`;
                });
                html += '</tbody></table>';
                document.getElementById('logsContainer').innerHTML = html;
            } catch (e) { toast('❌ Error: ' + e.message, 'error'); }
        }

        async function deleteSession(id) {
            if (!confirm(`Hapus sesi #${id}?`)) return;
            try {
                const res = await fetch(`/api/admin/session/${id}?admin_pass=${adminPass}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.ok) { toast(`🗑️ Sesi #${id} dihapus`, 'success'); loadSessions(); }
            } catch (e) { toast('❌ Error: ' + e.message, 'error'); }
        }

        if (adminPass) showDashboard();
    </script>
</body>
</html>
